[package]
name = "override"
version = "0.5.0"
edition = "2024"
description = "Symbol-based Rust source editing and dependency patching"
repository = "https://github.com/zetaloop/override"
license = "MIT"

[[bin]]
name = "override"
path = "src/cli/main.rs"
required-features = ["build"]

[dependencies]
base-db = { package = "override-base-db", version = "0.5.0", optional = true }
cargo-config2 = { version = "0.1.45", optional = true }
cargo_metadata = { version = "0.23.1", optional = true }
flate2 = { version = "1.1.11", optional = true }
format = { package = "override-format", version = "0.5.0", optional = true }
hir-def = { package = "override-hir-def", version = "0.5.0", optional = true }
hir-expand = { package = "override-hir-expand", version = "0.5.0", optional = true }
mbe = { package = "override-mbe", version = "0.5.0", optional = true }
parser = { package = "override-parser", version = "0.5.0", optional = true }
ra_ap_syntax = { version = "0.5.0", package = "override-syntax" }
salsa = { version = "0.28.5", default-features = false, optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }
span = { package = "override-span", version = "0.5.0", optional = true }
syntax-bridge = { package = "override-syntax-bridge", version = "0.5.0", optional = true }
tar = { version = "0.4.46", optional = true, default-features = false }
tempfile = { version = "3.27.0", default-features = false, optional = true }
toml = { version = "1.2.1", optional = true }
toml_edit = { version = "0.25.19", optional = true }
tt = { package = "override-tt", version = "0.5.0", optional = true }
triomphe = { version = "0.1.17", optional = true }

[features]
default = ["build"]
build = ["dep:cargo-config2", "dep:cargo_metadata", "dep:flate2", "dep:serde", "dep:serde_json", "dep:tar", "dep:tempfile", "dep:toml", "dep:toml_edit"]
expand = ["dep:base-db", "dep:format", "dep:hir-def", "dep:hir-expand", "dep:mbe", "dep:parser", "dep:salsa", "dep:span", "dep:syntax-bridge", "dep:triomphe", "dep:tt"]
