[package]
name = "override"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Structural Rust source editing and dependency build tools"
license = "MIT"

[dependencies]
cargo_metadata = { version = "0.23.1", optional = true }
ra_ap_syntax = "0.0.352"
toml = { version = "1.1.6", optional = true }
unicode-ident = "=1.0.24"

[features]
default = ["build"]
build = ["dep:cargo_metadata", "dep:toml"]

[dev-dependencies]
tempfile = "3.27.0"
