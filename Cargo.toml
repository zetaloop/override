[package]
name = "override"
version = "0.4.0"
edition = "2024"
rust-version = "1.98"
description = "Symbol-based Rust source editing and dependency patching"
repository = "https://github.com/zetaloop/override"
license = "MIT"

[dependencies]
cargo-config2 = { version = "0.1.45", optional = true }
cargo_metadata = { version = "0.23.1", optional = true }
flate2 = { version = "1.1.10", optional = true }
ra_ap_syntax = { version = "0.4.0", package = "override-syntax" }
serde_json = { version = "1.0.154", optional = true }
tar = { version = "0.4.46", optional = true, default-features = false }
toml = { version = "1.1.8", optional = true }

[features]
default = ["build"]
build = ["dep:cargo-config2", "dep:cargo_metadata", "dep:flate2", "dep:serde_json", "dep:tar", "dep:toml"]
