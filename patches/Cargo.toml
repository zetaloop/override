[package]
name = "override-patches"
version = "0.5.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "override"
path = "../src/lib.rs"

[features]
default = ["build"]
build = []

[dependencies]
cargo-config2 = "0.1.45"
cargo_metadata = "0.23.1"
flate2 = "1.1.11"
ra_ap_syntax = "=0.0.363"
serde_json = "1.0.154"
tar = { version = "0.4.46", default-features = false }
toml = { version = "1.2.1", features = ["preserve_order"] }
unicode-ident = "1.0.27"
unicode-properties = { version = "0.1.5", default-features = false, features = ["emoji"] }
