name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo +stable run --manifest-path patches/Cargo.toml
      - name: Publish generated parser crates
        run: |
          for crate in override-lexer override-parser override-syntax; do
            version=$(cargo +stable metadata --manifest-path "patches/target/out/$crate/Cargo.toml" --no-deps --format-version 1 | jq -r '.packages[0].version')
            code=$(curl -s -o /dev/null -w '%{http_code}' -A "$USER_AGENT" "https://crates.io/api/v1/crates/$crate/$version")
            case "$code" in
              200) echo "$crate $version already published" ;;
              404) cargo +stable publish --manifest-path "patches/target/out/$crate/Cargo.toml" ;;
              *) echo "crates.io answered $code for $crate $version"; exit 1 ;;
            esac
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          USER_AGENT: override-release (https://github.com/${{ github.repository }})
      - name: Publish override
        run: |
          version=$(cargo +stable metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "$USER_AGENT" "https://crates.io/api/v1/crates/override/$version")
          case "$code" in
            200) echo "override $version already published"; exit 0 ;;
            404) ;;
            *) echo "crates.io answered $code for override $version"; exit 1 ;;
          esac
          for _ in 1 2 3 4 5; do
            cargo +stable publish --allow-dirty && exit 0
            sleep 15
          done
          exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          USER_AGENT: override-release (https://github.com/${{ github.repository }})
