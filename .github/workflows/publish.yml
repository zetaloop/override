name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo +stable run --manifest-path patches/Cargo.toml
      - run: cargo +stable publish --workspace --manifest-path patches/target/out/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - run: |
          for _ in 1 2 3 4 5; do
            cargo +stable publish && exit 0
            sleep 15
          done
          exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
